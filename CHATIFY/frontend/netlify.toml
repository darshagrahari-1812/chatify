[build]
  command = "npm run build"
  publish = "dist"
  base = "."

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* calls to your deployed backend
# Replace YOUR_BACKEND_URL with your actual backend (Railway, Render, etc.)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

# SPA fallback — all other routes served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
